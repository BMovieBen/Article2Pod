<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article2Pod</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d0f12'/><text x='50' y='72' font-family='sans-serif' font-size='52' font-weight='bold' fill='%234ade80' text-anchor='middle'>A2P</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="logo">Article2Pod</div>
  <div class="comfy" id="comfy" title="ComfyUI status (start, stop and free memory are in Settings)"><span class="dot"></span><span id="comfyText">ComfyUI</span></div>
  <nav>
    <button data-tab="queue" class="active">Queue</button>
    <button data-tab="finished">Library</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>

<div class="banner" id="banner" hidden></div>

<main>
  <section id="tab-queue">
    <div class="add">
      <div class="toggle">
        <button id="modeUrl" class="active">URL</button>
        <button id="modeText">Text</button>
      </div>
      <input id="url" type="text" placeholder="Paste an article URL">
      <textarea id="text" rows="6" placeholder="Paste the article from Reader Mode" hidden></textarea>
      <button id="addBtn" class="primary">Add</button>
    </div>
    <div class="runbar">
      <button id="runBtn" class="primary big">Generate</button>
      <span id="runInfo" class="muted"></span>
    </div>
    <div id="queue" class="cards"></div>
  </section>

  <section id="tab-finished" hidden>
    <div class="runbar">
      <input id="libSearch" type="search" placeholder="Search titles, sites and authors">
      <span id="libCount" class="muted" style="white-space:nowrap"></span>
    </div>
    <div id="finished" class="cards"></div>
  </section>

  <section id="tab-stats" hidden>
    <div class="runbar">
      <select id="statsDays" style="width:auto">
        <option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="">All time</option>
      </select>
      <span id="statsNote" class="muted"></span>
    </div>
    <div id="stats"></div>
  </section>

  <section id="tab-settings" hidden>
    <div id="settings"></div>
  </section>
</main>

<div class="player" id="player" hidden>
  <div class="player-text"><div class="title" id="playerTitle"></div><div class="meta" id="playerMeta"></div></div>
  <audio id="audio" controls preload="metadata"></audio>
  <button class="icon" id="playerClose" title="Close the player"><i class="fa-solid fa-xmark"></i></button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
