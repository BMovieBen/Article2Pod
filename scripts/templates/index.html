<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d0f12'/><text x='50' y='72' font-family='sans-serif' font-size='52' font-weight='bold' fill='%234ade80' text-anchor='middle'>A2P</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article2Pod</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg:        #0d0f12;
    --surface:   #161920;
    --surface2:  #1e2229;
    --border:    #2a2f3a;
    --accent:    #4ade80;
    --accent2:   #22d3ee;
    --danger:    #f87171;
    --warn:      #fbbf24;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --radius:    12px;
    --mono:      'DM Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* Header */
  header {
    padding: 24px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 600px;
    margin: 0 auto;
  }

  header svg {
    display: block;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .status-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Main container */
  main {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
  }

  /* Input section */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  /* Toggle */
  .toggle {
    display: flex;
    background: var(--surface2);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 14px;
    width: fit-content;
  }

  .toggle button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .toggle button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  input[type="text"], textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px; /* iOS auto-zooms on focus for inputs under 16px */
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
  }

  input[type="text"]::placeholder, textarea::placeholder {
    color: var(--muted);
  }

  textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.5;
  }

  /* Text mode hint */
  .text-hint {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: rgba(34, 211, 238, 0.08);
    border: 1px solid rgba(34, 211, 238, 0.2);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--accent2);
    line-height: 1.5;
  }

  .text-hint ol {
    margin: 4px 0 0 16px;
    color: var(--muted);
  }

  /* Add button */
  .btn-add-text {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--accent);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    margin-top: 10px;
    width: 100%;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-add-text:hover {
    border-color: var(--accent);
    background: rgba(74, 222, 128, 0.08);
  }

  .btn-add-text:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Error banner */
  .error-banner {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.3);
    border-radius: 8px;
    color: var(--danger);
    font-size: 12px;
    font-family: var(--mono);
    padding: 10px 12px;
    margin-top: 10px;
    display: none;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* Queue section */
  .queue-header {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .queue-empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 32px 0;
  }

  /* Queue card */
  .queue-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .queue-card.status-processing {
    border-color: var(--accent2);
  }

  .queue-card.status-done {
    border-color: rgba(74, 222, 128, 0.3);
  }

  .queue-card.status-failed {
    border-color: rgba(248, 113, 113, 0.3);
  }

  .card-main {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
  }

  .card-art {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface2);
  }

  .card-art-placeholder {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 20px;
  }

  .card-art-editable {
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .card-art-editable:hover {
    opacity: 0.8;
  }

  .card-art-editable:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .card-art-editable.drag-over {
    outline: 2px dashed var(--accent);
    outline-offset: 2px;
  }

  .art-wrapper {
    position: relative;
    flex-shrink: 0;
  }

  .art-paste-target {
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .art-paste-target:hover,
  .art-paste-target:focus {
    border-color: var(--accent);
    color: var(--accent);
  }

  .card-info {
    flex: 1;
    min-width: 0;
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
    margin-bottom: 2px;
  }

  .card-meta {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    height: 32px;
    width: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .btn-icon:hover {
    color: var(--text);
    border-color: var(--text);
  }

  .btn-icon:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .btn-icon:disabled:hover {
    color: var(--muted);
    border-color: var(--border);
  }

  .btn-icon.danger:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  .btn-icon.success {
    color: var(--accent);
    border-color: rgba(74, 222, 128, 0.3);
  }

  .btn-icon.success:hover {
    background: rgba(74, 222, 128, 0.1);
    border-color: var(--accent);
  }

  /* Spinner */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Fetch output collapsible */
  .card-output {
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
  }

  .card-output.open {
    max-height: 300px;
  }

  .card-output-inner {
    padding: 10px 12px;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-y: auto;
    max-height: 300px;
  }

  .card-error {
    border-top: 1px solid rgba(248, 113, 113, 0.2);
    background: rgba(248, 113, 113, 0.05);
    padding: 10px 12px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--danger);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .card-fetching {
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }

  /* Toggle output button */
  .btn-output-toggle {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    font-family: var(--mono);
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .btn-output-toggle:hover {
    color: var(--text);
  }

  /* Generate / Stop button */
  .generate-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  .btn-generate {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 50px;
    color: #0d0f12;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 800;
    padding: 14px 48px;
    letter-spacing: 0.3px;
    transition: all 0.2s;
    box-shadow: 0 4px 24px rgba(74, 222, 128, 0.25);
  }

  .btn-generate:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 32px rgba(74, 222, 128, 0.35);
  }

  .btn-generate:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-generate.stop {
    background: linear-gradient(135deg, var(--danger), #fb923c);
    box-shadow: 0 4px 24px rgba(248, 113, 113, 0.25);
  }

  .btn-generate.stop:hover {
    box-shadow: 0 6px 32px rgba(248, 113, 113, 0.35);
  }

  /* Adding spinner overlay on card */
  .adding-overlay {
    padding: 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }

  .library-accordion {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 80px;
    overflow: hidden;
  }

  .library-header {
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 14px 16px;
    transition: background 0.2s;
  }

  .library-header:hover {
    background: var(--surface2);
  }

  .library-body {
    border-top: 1px solid var(--border);
  }

  .library-card {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }

  .library-card:last-child {
    border-bottom: none;
  }

  .library-load-more {
    width: 100%;
    background: none;
    border: none;
    border-top: 1px solid var(--border);
    color: var(--accent);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    padding: 12px;
    transition: background 0.2s;
  }

  .library-load-more:hover {
    background: var(--surface2);
  }

  /* Settings panel */
  .settings-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: none;
    overflow: hidden;
  }

  .settings-panel .settings-row {
    max-width: 560px;
    margin: 0 auto;
  }

  .settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .settings-row select {
    min-width: 0;
    flex: 1 1 140px;
  }

  .settings-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 600;
  }

  select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    flex: 1;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  select:focus {
    border-color: var(--accent);
  }

  .btn-save {
    background: none;
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-save:hover {
    background: rgba(74, 222, 128, 0.1);
  }

  .btn-gear {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 0;
    line-height: 1;
    transition: color 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
  }

  .btn-gear:hover {
    color: var(--text);
  }

  .btn-gear.customized {
    color: var(--accent);
  }

  /* Card voice panel */
  .card-voice-panel {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
  }

  .card-edit-fields {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 2px;
  }

  .edit-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 6px 8px;
    outline: none;
    width: 100%;
    box-sizing: border-box;
  }

  .edit-input:focus {
    border-color: var(--accent);
    position: relative;
    z-index: 1;
  }

  /* Title + Author are visually joined into one block (shared border,
     no gap) so it's clear the swap button relates to this pair
     specifically, not the Site field below. */
  .edit-title-author-group {
    position: relative;
  }

  .edit-title-author-group .edit-input:first-child {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    margin-bottom: -1px;
  }

  .edit-title-author-group .edit-input:last-child {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
  }

  .btn-swap {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .btn-swap:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <svg width="150" height="28" viewBox="0 0 150 28" style="overflow:visible;flex-shrink:0;">
    <defs>
      <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:var(--accent)" />
        <stop offset="100%" style="stop-color:var(--accent2)" />
      </linearGradient>
    </defs>
    <text x="0" y="21" font-family="Syne, sans-serif" font-size="22"
          font-weight="800" letter-spacing="-0.5"
          fill="url(#logoGradient)">Article2Pod</text>
  </svg>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="status-dot" id="statusDot"></div>
    <button class="btn-gear" id="headerGear"
            onclick="toggleSettings()"
            title="Settings"
            style="width:32px;height:32px;font-size:16px;color:var(--muted);">
      <i class="fa-solid fa-gear"></i>
    </button>
  </div>
</header>

<!-- Settings panel (below header, above main) -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-row">
    <span class="settings-label">Default Voice</span>
    <select id="defaultVoiceSelect" onchange="defaultVoiceChanged()">
      <option value="">Loading...</option>
    </select>
    <button class="btn-save" id="saveDefaultVoice"
            onclick="saveDefaultVoice()" disabled>Save</button>
  </div>
  <div class="settings-row" style="margin-top:12px;">
    <span class="settings-label">ComfyUI</span>
    <span id="comfyStatusText" style="font-size:12px;color:var(--muted);flex:1;">Checking...</span>
    <button class="btn-icon" id="comfyFreeBtn"
            onclick="freeComfyMemory()" disabled
            title="Free ComfyUI memory (unload models)">
      <i class="fa-solid fa-recycle"></i>
    </button>
    <button class="btn-save" id="comfyToggleBtn"
            onclick="toggleComfyUI()" disabled>...</button>
  </div>
</div>

<main>
  <!-- Input Section -->
  <div class="input-section">
    <div class="toggle">
      <button class="active" id="btnUrl" onclick="setMode('url')">URL</button>
      <button id="btnText" onclick="setMode('text')">Text</button>
    </div>

    <!-- URL mode -->
    <div id="urlMode">
      <input type="text" id="urlInput" placeholder="Paste article URL..."
             onkeydown="if(event.key==='Enter') addUrl()">
      <button class="btn-add-text" id="addBtn" onclick="addUrl()">Add to Queue</button>
    </div>

    <!-- Text mode -->
    <div id="textMode" style="display:none">
      <div class="text-hint">
        <span>&#9432;</span>
        <div>
          Use browser <strong>Reader Mode</strong> to get clean article text:
          <ol>
            <li>Open article in Firefox or Edge</li>
            <li>Enable Reader Mode (F9)</li>
            <li>Select All (Ctrl+A) and Copy (Ctrl+C)</li>
            <li>Paste below</li>
          </ol>
        </div>
      </div>
      <textarea id="textInput" placeholder="Paste plain text article content here..."></textarea>
      <button class="btn-add-text" onclick="addText()">Add to Queue</button>
    </div>

    <div class="error-banner" id="errorBanner"></div>
  </div>

<!-- Queue -->
  <div id="queueSection" style="display:none;">
    <div class="queue-header">Queue</div>
    <div id="queueList"></div>
    <div class="queue-empty" id="queueEmpty" style="display:none;">No articles queued yet.</div>
  </div>
<!-- Library accordion -->
  <div class="library-accordion" id="libraryAccordion" style="display:none;">
    <button class="library-header" onclick="toggleLibrary()" id="libraryHeader">
      <span>Library</span>
      <span id="libraryCount" style="color:var(--muted);font-size:12px;font-weight:400;"></span>
      <span id="libraryChevron" style="margin-left:auto;font-size:14px;color:var(--muted);">&#8964;</span>
    </button>
    <div class="library-body" id="libraryBody" style="display:none;">
      <div id="libraryList"></div>
      <button class="library-load-more" id="libraryLoadMore"
              onclick="loadLibrary()" style="display:none;">
        Load more
      </button>
    </div>
  </div>
</main>

<!-- Generate / Stop -->
<div class="generate-wrap">
  <button class="btn-generate" id="generateBtn" onclick="handleGenerate()" disabled>
    Generate
  </button>
</div>

<input type="file" id="artFileInput"
       accept="image/png,image/jpeg,image/gif,image/bmp,image/webp,image/*"
       style="display:none" onchange="handleArtFileSelected(event)">

<script>
  let mode       = 'url';
  let isProcessing = false;
  let stopPending  = false;
  let interruptErrorShown = false;  // guards against re-showing the same comfy interrupt error every poll
  let pollInterval    = 10000;  // default idle interval
  let pollTimer       = null;
  let confirmingSlug  = null;   // slug currently showing delete confirmation
  let libraryOpen    = false;
  let libraryOffset  = 0;
  let libraryHasMore = false;
  let confirmingLibPath = null;
  let settingsOpen    = false;
  let comfyStatusPollTimer = null;  // self-terminating: only reschedules while settingsOpen
  let comfyOpInFlight  = false;     // guards start/stop clicks independent of DOM disabled state
  let voicesCache     = null;   // cached voice list
  let voicePanelOpenCount = 0;
  let defaultVoice    = '';     // current default from config
  let pendingDefault  = '';     // staged but unsaved default change
  const voicePanelOpen = {};    // slug -> bool
  const editOriginal = {};      // slug -> {title, artist, album} snapshot for dirty-check on close
  let artUploadTargetSlug = null;  // which card's art the shared file input is currently for
  const libArtPaths = {};          // library art key -> MP3 relative path (keys not in here are queue slugs)
  const MAX_ART_UPLOAD_BYTES = 20 * 1024 * 1024;  // 20MB sanity cap, not a hard architectural limit
  // Track which cards have output panel open
  const outputOpen = {};

  function setMode(m) {
    mode = m;
    document.getElementById('urlMode').style.display   = m === 'url'  ? '' : 'none';
    document.getElementById('textMode').style.display  = m === 'text' ? '' : 'none';
    document.getElementById('btnUrl').classList.toggle('active', m === 'url');
    document.getElementById('btnText').classList.toggle('active', m === 'text');
    clearError();
  }

  function showError(msg) {
    const el = document.getElementById('errorBanner');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('errorBanner').style.display = 'none';
  }

  function triggerArtUpload(slug) {
    artUploadTargetSlug = slug;
    document.getElementById('artFileInput').click();
  }

  function handleArtFileSelected(event) {
    const file = event.target.files && event.target.files[0];
    event.target.value = '';  // reset so picking the same file again still fires change
    if (file && artUploadTargetSlug) uploadArtFile(artUploadTargetSlug, file);
  }

  function handleArtPaste(slug, event) {
    event.preventDefault();  // never let anything actually paste into the badge itself
    const items = (event.clipboardData || window.clipboardData).items;
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) uploadArtFile(slug, file);
        return;
      }
    }
  }

  function handleArtDragOver(slug, event) {
    event.preventDefault();
    const el = document.getElementById(`art-${slug}`);
    if (el) el.classList.add('drag-over');
  }

  function handleArtDragLeave(slug, event) {
    const el = document.getElementById(`art-${slug}`);
    if (el) el.classList.remove('drag-over');
  }

  function handleArtDrop(slug, event) {
    event.preventDefault();
    const el = document.getElementById(`art-${slug}`);
    if (el) el.classList.remove('drag-over');
    const file = event.dataTransfer.files && event.dataTransfer.files[0];
    if (file && file.type && file.type.startsWith('image/')) {
      uploadArtFile(slug, file);
    }
  }

  async function uploadArtFile(slug, file) {
    if (file.size > MAX_ART_UPLOAD_BYTES) {
      showError('That image is too large (max 20MB).');
      return;
    }

    const el = document.getElementById(`art-${slug}`);
    if (el) el.style.opacity = '0.5';

    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read file.'));
        reader.readAsDataURL(file);
      });

      // Same art target helpers serve queue cards (keyed by slug) and
      // library cards (keyed by a per-render id mapped to the MP3 path).
      const libPath = libArtPaths[slug];
      const res  = await fetch(libPath ? '/api/library/art' : '/api/queue/art', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(libPath ? {path: libPath, image_data: dataUrl}
                                     : {slug, image_data: dataUrl}),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || 'Could not set album art.');
      } else if (data.album_art_b64) {
        // Update in place -- works even while polling is paused (e.g.
        // the metadata edit panel is open for this same card).
        updateCardArtDisplay(slug, data.album_art_b64);
      }
    } catch (e) {
      showError('Could not set album art.');
    } finally {
      const el2 = document.getElementById(`art-${slug}`);
      if (el2) el2.style.opacity = '';
    }
  }

  function updateCardArtDisplay(slug, dataUrl) {
    const el = document.getElementById(`art-${slug}`);
    if (!el) return;
    if (el.tagName === 'IMG') {
      el.src = dataUrl;
      return;
    }
    // Was a placeholder div (no art yet) -- swap it for a real <img> in
    // place, carrying over the same id/class/handlers so it stays an
    // upload/paste/drop target afterward.
    const img = document.createElement('img');
    img.id        = el.id;
    img.className = el.className.replace('card-art-placeholder', 'card-art');
    img.src       = dataUrl;
    img.alt       = '';
    img.title       = el.title;
    img.onclick     = el.onclick;
    img.ondragover  = el.ondragover;
    img.ondragleave = el.ondragleave;
    img.ondrop      = el.ondrop;
    el.replaceWith(img);
  }

  async function initLibrary() {
    try {
      const res  = await fetch('/api/library');
      const data = await res.json();
      const accordion = document.getElementById('libraryAccordion');
      accordion.style.display = data.total > 0 ? '' : 'none';
      if (data.total > 0) {
        document.getElementById('libraryCount').textContent =
          `(${data.total} podcast${data.total !== 1 ? 's' : ''})`;
      }
    } catch (e) {}
  }

  async function loadVoices() {
    if (voicesCache) return voicesCache;
    try {
      const res  = await fetch('/api/voices');
      const data = await res.json();
      voicesCache  = data.voices || [];
      defaultVoice = data.default || '';
      pendingDefault = defaultVoice;
      return voicesCache;
    } catch (e) {
      return [];
    }
  }

  async function toggleSettings() {
    settingsOpen = !settingsOpen;
    const panel = document.getElementById('settingsPanel');
    const gear  = document.getElementById('headerGear');
    panel.style.display = settingsOpen ? 'block' : 'none';
    gear.style.color = settingsOpen ? 'var(--accent)' : 'var(--muted)';

    if (settingsOpen) {
      const voices = await loadVoices();
      const sel    = document.getElementById('defaultVoiceSelect');
      sel.innerHTML = voices.map(v =>
        `<option value="${escHtml(v)}" ${v === defaultVoice ? 'selected' : ''}>${v === 'shuffle' ? '🎲 Shuffle' : escHtml(v)}</option>`
      ).join('');
      document.getElementById('saveDefaultVoice').disabled = true;
      pendingDefault = defaultVoice;

      pollComfyStatus();  // starts a self-terminating poll loop while the panel is open
    }
  }

  function defaultVoiceChanged() {
    const sel = document.getElementById('defaultVoiceSelect');
    pendingDefault = sel.value;
    document.getElementById('saveDefaultVoice').disabled =
      (pendingDefault === defaultVoice);
  }

  async function saveDefaultVoice() {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({voice_file: pendingDefault}),
    });
    if (res.ok) {
      defaultVoice = pendingDefault;
      voicesCache  = null;  // force refresh next time
      document.getElementById('saveDefaultVoice').disabled = true;
      // Flash the button briefly
      const btn = document.getElementById('saveDefaultVoice');
      btn.textContent = 'Saved!';
      setTimeout(() => { btn.textContent = 'Save'; }, 1500);
    } else {
      showError('Could not save default voice.');
    }
  }

  function updateComfyStatusUI(data) {
    const textEl  = document.getElementById('comfyStatusText');
    const btn     = document.getElementById('comfyToggleBtn');
    const freeBtn = document.getElementById('comfyFreeBtn');

    if (data.manual_op === 'starting') {
      textEl.textContent = 'Starting...';
      btn.textContent    = 'Starting...';
      btn.disabled       = true;
      freeBtn.disabled   = true;
    } else if (data.manual_op === 'stopping') {
      textEl.textContent = 'Stopping...';
      btn.textContent    = 'Stopping...';
      btn.disabled       = true;
      freeBtn.disabled   = true;
    } else if (data.running) {
      textEl.textContent = 'Running';
      btn.textContent    = 'Stop';
      btn.disabled       = false;
      freeBtn.disabled   = false;
      comfyOpInFlight     = false;  // resolved -- safe to accept another click
    } else {
      textEl.textContent = 'Stopped';
      btn.textContent    = 'Start';
      btn.disabled       = false;
      freeBtn.disabled   = true;  // nothing to free if it isn't running
      comfyOpInFlight     = false;
    }
  }

  async function pollComfyStatus() {
    if (comfyStatusPollTimer) {
      clearTimeout(comfyStatusPollTimer);
      comfyStatusPollTimer = null;
    }
    if (!settingsOpen) return;  // panel closed -- stop the loop here

    try {
      const res  = await fetch('/api/comfyui/status');
      const data = await res.json();
      updateComfyStatusUI(data);
    } catch (e) {
      document.getElementById('comfyStatusText').textContent = 'Unknown';
    }

    comfyStatusPollTimer = setTimeout(pollComfyStatus, 3000);
  }

  async function toggleComfyUI() {
    // Guards against a second click firing during the starting/stopping
    // window -- checked independently of the button's disabled attribute
    // as a belt-and-suspenders measure, and persists correctly across
    // settings-panel close/reopen since it's only ever cleared once
    // polling confirms the operation actually resolved (see
    // updateComfyStatusUI), not on a timer or on panel close.
    if (comfyOpInFlight) return;
    comfyOpInFlight = true;

    const btn     = document.getElementById('comfyToggleBtn');
    const freeBtn = document.getElementById('comfyFreeBtn');
    const action  = btn.textContent === 'Stop' ? 'stop' : 'start';

    // Immediate optimistic update, same pattern as Generate/Stop --
    // don't wait for the network round trip to disable/relabel.
    btn.disabled     = true;
    btn.textContent  = action === 'start' ? 'Starting...' : 'Stopping...';
    freeBtn.disabled = true;

    try {
      const res  = await fetch(`/api/comfyui/${action}`, {method: 'POST'});
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || `Could not ${action} ComfyUI.`);
        comfyOpInFlight = false;  // failed immediately -- allow retry right away
      }
      // On success, comfyOpInFlight stays true until polling confirms the
      // background start/stop actually finished.
    } catch (e) {
      showError(`Could not ${action} ComfyUI.`);
      comfyOpInFlight = false;
    }

    pollComfyStatus();  // reconcile with real state either way
  }

  async function freeComfyMemory() {
    const btn = document.getElementById('comfyFreeBtn');
    if (btn.disabled) return;

    const originalHTML = btn.innerHTML;
    btn.disabled   = true;
    btn.innerHTML  = '<div class="spinner" style="width:14px;height:14px;border-width:2px;"></div>';

    try {
      const res  = await fetch('/api/comfyui/free', {method: 'POST'});
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || 'Could not free ComfyUI memory.');
        btn.innerHTML = originalHTML;
      } else {
        btn.innerHTML = '<i class="fa-solid fa-check" style="color:var(--accent);"></i>';
        setTimeout(() => { btn.innerHTML = originalHTML; }, 1500);
      }
    } catch (e) {
      showError('Could not free ComfyUI memory.');
      btn.innerHTML = originalHTML;
    }

    pollComfyStatus();  // reconciles freeBtn.disabled with real state
  }

  async function populateVoiceSelect(selectId, currentVoice, show) {
    const sel = document.getElementById(selectId);
    if (!sel) return;

    const voices = await loadVoices();
    // First option: use default
    const defaultLabel = defaultVoice === 'shuffle' ? '🎲 Shuffle' : escHtml(defaultVoice);
    const opts = [`<option value="">Default (${defaultLabel})</option>`];
    voices.forEach(v => {
      const selected = (v === currentVoice) ? 'selected' : '';
      const label    = v === 'shuffle' ? '🎲 Shuffle' : escHtml(v);
      opts.push(`<option value="${escHtml(v)}" ${selected}>${label}</option>`);
    });
    sel.innerHTML = opts.join('');
    if (currentVoice) sel.value = currentVoice;
  }

  async function toggleCardVoice(slug) {
    const opening = !voicePanelOpen[slug];
    voicePanelOpen[slug] = opening;
    voicePanelOpenCount  = Math.max(0, voicePanelOpenCount + (opening ? 1 : -1));

    const panel        = document.getElementById(`voice-panel-${slug}`);
    const titleDisplay = document.getElementById(`title-display-${slug}`);
    const metaDisplay  = document.getElementById(`meta-display-${slug}`);
    const editFieldsEl = document.getElementById(`edit-fields-${slug}`);

    if (opening) {
      if (panel)        panel.style.display        = '';
      if (titleDisplay) titleDisplay.style.display = 'none';
      if (metaDisplay)  metaDisplay.style.display  = 'none';
      if (editFieldsEl) editFieldsEl.style.display = '';

      await populateVoiceSelect(`voice-select-${slug}`, '');
      try {
        const res  = await fetch('/api/queue');
        const data = await res.json();
        const item = (data.queue || []).find(i => i.slug === slug);
        if (item) {
          await populateVoiceSelect(`voice-select-${slug}`, item.voice || '');

          editOriginal[slug] = {
            title:  item.title  || '',
            artist: item.artist || '',
            album:  item.album  || '',
          };
          const t = document.getElementById(`edit-title-${slug}`);
          const a = document.getElementById(`edit-author-${slug}`);
          const s = document.getElementById(`edit-site-${slug}`);
          if (t) t.value = editOriginal[slug].title;
          if (a) a.value = editOriginal[slug].artist;
          if (s) s.value = editOriginal[slug].album;
        }
      } catch (e) {}
      return;
    }

    // Closing -- save metadata if it actually changed, then collapse
    // back to the plain-text display.
    const t    = document.getElementById(`edit-title-${slug}`);
    const a    = document.getElementById(`edit-author-${slug}`);
    const s    = document.getElementById(`edit-site-${slug}`);
    const orig = editOriginal[slug] || {};

    if (t && a && s) {
      const newTitle  = t.value.trim();
      const newAuthor = a.value.trim();
      const newSite   = s.value.trim();

      if (newTitle !== (orig.title || '') ||
          newAuthor !== (orig.artist || '') ||
          newSite !== (orig.album || '')) {
        try {
          const res  = await fetch('/api/queue/metadata', {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({slug, title: newTitle, artist: newAuthor, album: newSite}),
          });
          const data = await res.json();
          if (!res.ok) {
            showError(data.error || 'Could not save metadata.');
          } else {
            if (titleDisplay) titleDisplay.textContent = newTitle;
            if (metaDisplay) {
              metaDisplay.textContent = (newSite && newAuthor)
                ? `${newSite} \u00b7 ${newAuthor}` : (newSite || newAuthor);
            }
          }
        } catch (e) {
          showError('Could not save metadata.');
        }
      }
    }
    delete editOriginal[slug];

    if (panel)        panel.style.display        = 'none';
    if (editFieldsEl) editFieldsEl.style.display = 'none';
    if (titleDisplay) titleDisplay.style.display = '';
    if (metaDisplay)  metaDisplay.style.display  = '';
  }

  function swapTitleAuthor(slug) {
    const t = document.getElementById(`edit-title-${slug}`);
    const a = document.getElementById(`edit-author-${slug}`);
    if (!t || !a) return;
    const tmp = t.value;
    t.value   = a.value;
    a.value   = tmp;
  }

  async function setCardVoice(slug, voice) {
    try {
      const res = await fetch('/api/queue/voice', {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({slug, voice}),
      });
      if (!res.ok) {
        showError('Could not update voice.');
        return;
      }
      // Update gear color based on whether voice differs from default
      const gear = document.getElementById(`gear-${slug}`);
      if (gear) {

          gear.classList.remove('customized');

  function isValidUrl(str) {
    try {
      const url = new URL(str);
      return url.protocol === 'http:' || url.protocol === 'https:';
    } catch {
      return false;
    }
  }

  async function addUrl() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;

    if (!isValidUrl(url)) {
      showError('That doesn\'t look like a URL. Did you mean to use Text mode?');
      return;
    }
    
    clearError();
    setAdding(true);

    const res  = await fetch('/api/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url, mode: 'url'}),
    });
    const data = await res.json();

    if (!res.ok) {
      const ph = document.getElementById('adding-placeholder');
      if (ph) ph.remove();
      document.getElementById('addBtn').disabled = false;
      showError(data.error || 'Failed to add article.');
      if (data.switch_to_text) {
        document.getElementById('urlInput').value = '';
        setMode('text');
        document.getElementById('textInput').placeholder =
          'Site is blocked. Paste Reader Mode content here...';
      }
      return;
    }

    activeFetchId = data.fetch_id;
    pollFetchResult(data.fetch_id, () => {
      document.getElementById('urlInput').value  = '';
      document.getElementById('textInput').value = '';
      document.getElementById('addBtn').disabled = false;
    });
  }

  async function addText() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) return;
    clearError();
    setAdding(true);

    const res  = await fetch('/api/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, mode: 'text'}),
    });
    const data = await res.json();

    if (!res.ok) {
      const ph = document.getElementById('adding-placeholder');
      if (ph) ph.remove();
      document.getElementById('addBtn').disabled = false;
      showError(data.error || 'Failed to add article.');
      return;
    }

    activeFetchId = data.fetch_id;
    pollFetchResult(data.fetch_id, () => {
      document.getElementById('urlInput').value  = '';
      document.getElementById('textInput').value = '';
      document.getElementById('addBtn').disabled = false;
    });
  }

  let activeFetchId = null;  // track current fetch to prevent stale polls

  async function pollFetchResult(fetchId, onSuccess) {
    // If a newer fetch has started, abandon this poll
    if (fetchId !== activeFetchId) return;

    let res, data;
    try {
      res  = await fetch(`/api/add/poll/${fetchId}`);
      data = await res.json();
    } catch (e) {
      const ph = document.getElementById('adding-placeholder');
      if (ph) ph.remove();
      document.getElementById('addBtn').disabled = false;
      showError('Network error while fetching article.');
      activeFetchId = null;
      return;
    }

    if (data.status === 'pending') {
      setTimeout(() => pollFetchResult(fetchId, onSuccess), 1000);
      return;
    }

    const ph = document.getElementById('adding-placeholder');

    if (!res.ok || data.status === 'error') {
      if (ph) ph.remove();
      document.getElementById('addBtn').disabled = false;
      activeFetchId = null;
      showError(data.error || 'Failed to add article.');
      if (data.switch_to_text) {
        setMode('text');
        document.getElementById('urlInput').value = '';
        document.getElementById('textInput').placeholder =
          'Site is blocked. Paste Reader Mode content here...';
      }
      return;
    }

    // Success — remove placeholder, close any open voice panels, poll immediately
    if (ph) ph.remove();
    activeFetchId = null;

    // Close any open voice panels so polling isn't blocked
    Object.keys(voicePanelOpen).forEach(slug => {
      if (voicePanelOpen[slug]) {
        voicePanelOpen[slug] = false;
        const panel = document.getElementById(`voice-panel-${slug}`);
        if (panel) panel.style.display = 'none';
      }
    });
    voicePanelOpenCount = 0;

    if (onSuccess) onSuccess();
    pollQueue();
  }

  function setAdding(adding) {
    document.getElementById('addBtn').disabled = adding;
    const list  = document.getElementById('queueList');
    const empty = document.getElementById('queueEmpty');
    if (adding) {
      // Always create a fresh placeholder
      const existing = document.getElementById('adding-placeholder');
      if (existing) existing.remove();
      const div = document.createElement('div');
      div.className = 'queue-card';
      div.id = 'adding-placeholder';
      div.innerHTML = `<div class="adding-overlay"><div class="spinner"></div>Fetching article...</div>`;
      list.insertBefore(div, list.firstChild);
      empty.style.display = 'none';
    }
  }

  function renderSingleCard(data) {
    // Called immediately after a successful add — inserts card with known data
    // Full queue poll will keep it updated
    pollQueue(); // just trigger a full refresh
  }

  function handleGenerate() {
    if (isProcessing) {
      stopQueue();
    } else {
      startGenerate();
    }
  }

async function startGenerate() {
    // Close any open voice panels so polling resumes
    Object.keys(voicePanelOpen).forEach(slug => {
      if (voicePanelOpen[slug]) {
        voicePanelOpen[slug] = false;
        const panel = document.getElementById(`voice-panel-${slug}`);
        if (panel) panel.style.display = 'none';
      }
    });
    voicePanelOpenCount = 0;

    // Switch button to Stop immediately — don't wait for poll
    const btn = document.getElementById('generateBtn');
    btn.textContent = 'Stop';
    btn.classList.add('stop');
    btn.disabled = false;

    const res  = await fetch('/api/generate', {method: 'POST'});
    const data = await res.json();
    if (!res.ok) {
      // Revert button if it failed
      btn.textContent = 'Generate';
      btn.classList.remove('stop');
      showError(data.error || 'Could not start generation.');
      return;
    }

    schedulePoll(0);
  }

  async function stopQueue() {
    stopPending = true;
    document.getElementById('generateBtn').textContent = 'Stopping...';
    const res  = await fetch('/api/stop', {method: 'POST'});
    const data = await res.json();
    if (data.comfy_interrupt_error) {
      showError(data.comfy_interrupt_error);
    }
    schedulePoll(0);
  }

      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({slug}),

    if (res.ok) {

  async function openItem(slug) {

      method: 'POST',

  async function retryItem(slug) {
    const res = await fetch('/api/retry', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({slug}),
    });
    if (!res.ok) {
      const d = await res.json();

  function updateGenerateBtn() {
    // Updated by poll
  }

  // ---- Polling ----
  function schedulePoll(interval) {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => {
      await pollQueue();
    }, interval);
  }

  async function pollQueue() {
    // Don't poll while a delete confirmation is showing
    if (confirmingSlug || voicePanelOpenCount > 0) {
      schedulePoll(1000);  // check again soon in case it clears
      return;
    }

    try {
      const res  = await fetch('/api/queue');
      const data = await res.json();

      isProcessing = data.processing;
      renderQueue(data.queue, data.processing);

      if (data.comfy_interrupt_error && !interruptErrorShown) {
        interruptErrorShown = true;
        showError(data.comfy_interrupt_error);
      } else if (!data.comfy_interrupt_error) {
        interruptErrorShown = false;
      }

      const dot = document.getElementById('statusDot');
      dot.classList.toggle('active', data.processing);

      const btn = document.getElementById('generateBtn');
      if (data.processing) {
        btn.textContent = stopPending ? 'Stopping...' : 'Stop';
        btn.classList.add('stop');
        btn.disabled = stopPending;
      } else {
        stopPending = false;
        btn.classList.remove('stop');
        btn.textContent = 'Generate';
        const hasPending = data.queue.some(
          i => i.status === 'pending' || i.status === 'failed'
        );
        btn.disabled = !hasPending;
      }

      // Adaptive interval — fast when processing, slow when idle
      schedulePoll(data.processing ? 2000 : 10000);

    } catch (e) {
      schedulePoll(5000);  // back off on error
    }

    // Refresh library count if open
    if (libraryOpen) {
      fetch('/api/library').then(r => r.json()).then(data => {
        const accordion = document.getElementById('libraryAccordion');
        if (data.total === 0) {
          accordion.style.display = 'none';
          return;
        }
        accordion.style.display = '';
        document.getElementById('libraryCount').textContent =
          `(${data.total} podcast${data.total !== 1 ? 's' : ''})`;
      }).catch(() => {});
    }
  }

  // Album art thumbnail. When editable, click/drop live on the thumbnail
  // itself. Paste does NOT -- clicking the thumbnail opens the file picker,
  // which would steal focus and make it impossible to ever focus the
  // thumbnail for a paste. Paste gets its own dedicated badge instead,
  // using a contenteditable element so iOS (which only offers a native
  // Paste action over an editable region) has something to paste into.
  function artCellHtml(key, artB64, editable) {
    const k = escHtml(escJs(key));
    const interactionAttrs = editable ? `
      onclick="triggerArtUpload('${k}')"
      ondragover="handleArtDragOver('${k}', event)"
      ondragleave="handleArtDragLeave('${k}', event)"
      ondrop="handleArtDrop('${k}', event)"
      title="Click or drop an image to set custom art"
    ` : '';

    const pasteTargetHtml = editable ? `
      <div class="art-paste-target" id="paste-${escHtml(key)}"
           contenteditable="true" tabindex="0"
           onpaste="handleArtPaste('${k}', event)"
           title="Tap here, then paste an image (Ctrl+V)"><i class="fa-solid fa-clipboard"></i></div>
    ` : '';

    const baseClass = artB64 ? 'card-art' : 'card-art-placeholder';
    const cls       = editable ? `${baseClass} card-art-editable` : baseClass;

    return artB64
      ? `<div class="art-wrapper"><img id="art-${escHtml(key)}" class="${cls}" src="${artB64}" alt="" ${interactionAttrs}>${pasteTargetHtml}</div>`
      : `<div class="art-wrapper"><div id="art-${escHtml(key)}" class="${cls}" ${interactionAttrs}>&#9834;</div>${pasteTargetHtml}</div>`;
  }

  function renderQueue(queue, processing) {
    const list    = document.getElementById('queueList');
    const section = document.getElementById('queueSection');
    const ph      = document.getElementById('adding-placeholder');

    // Show queue section if there are items or a fetch is in progress
    section.style.display = (queue.length > 0 || ph) ? '' : 'none';

    list.innerHTML = '';
    if (ph) list.appendChild(ph);

    queue.forEach((item) => {
      try {
        const card = document.createElement('div');
        card.className    = `queue-card status-${item.status}`;
        card.dataset.slug = item.slug;

        // Metadata (and voice, for text articles) is editable while
        // pending, for every pipeline type. Art can also be swapped once
        // the item is done -- that rewrites the art in the finished MP3.
        const isEditable    = item.status === 'pending';
        const isArtEditable = item.status === 'pending' || item.status === 'done';
        const isTextArticle = (item.pipeline_type || 'comfyui') === 'comfyui';

        const artHtml = artCellHtml(item.slug, item.album_art_b64, isArtEditable);

        // Gear is accent-colored if item has a custom voice set
        const gearClass = item.voice ? 'btn-gear customized' : 'btn-gear';

        let actionHtml = '';
        if (item.status === 'processing') {
          actionHtml = `<div class="spinner"></div>`;
        } else if (item.status === 'done') {
          actionHtml = `
            <a class="btn-icon success"
              href="/api/download/${escHtml(item.slug)}"
              download
              title="Download MP3">&#8595;</a>
            <button class="btn-icon danger"
              onclick="confirmDelete('${escHtml(escJs(item.slug))}', '${escHtml(escJs(item.title || item.slug))}')"
              title="Delete MP3"
              style="font-size:14px;"><i class="fa-solid fa-trash"></i></button>`;
        } else if (item.status === 'failed') {
          actionHtml = `
            <button class="btn-icon"
              onclick="retryItem('${escHtml(escJs(item.slug))}')"
              title="Retry"
              style="font-size:13px;color:var(--accent);">&#8635;</button>
            <span style="color:var(--danger);font-size:18px;"
              title="${escHtml(item.error || '')}">&#10005;</span>`;
        } else if (item.status === 'pending') {
          const pipelineType = item.pipeline_type || 'comfyui';
          const gearClass    = item.voice ? 'btn-gear customized' : 'btn-gear';

          // Gear toggles the metadata edit fields for every pipeline;
          // the voice dropdown inside it only exists for text articles.
          const gearBtn = `
            <button class="${gearClass}"
              onclick="toggleCardVoice('${escHtml(escJs(item.slug))}')"
              title="${pipelineType === 'comfyui' ? 'Voice and details' : 'Edit details'}"
              id="gear-${escHtml(item.slug)}">
              <i class="fa-solid fa-gear"></i></button>`;

          let pipelineIcon = '';
          if (pipelineType === 'audio') {
            pipelineIcon = `
              <span class="btn-gear" title="Embedded audio — will download directly"
                style="cursor:default;color:var(--accent2);">
                <i class="fa-solid fa-music"></i></span>`;
          } else if (pipelineType === 'youtube') {
            pipelineIcon = `
              <span class="btn-gear" title="YouTube — will download directly"
                style="cursor:default;color:#ff4444;">
                <i class="fa-brands fa-youtube"></i></span>`;
          }

          actionHtml = `
            ${pipelineIcon}
            ${gearBtn}
            <button class="btn-icon danger"
              onclick="removeItem('${escHtml(escJs(item.slug))}')"
              title="Remove"
              style="font-size:22px;font-weight:700;line-height:1;padding-bottom:2px;">-</button>`;
        }

        const hasOutput    = item.fetch_output || item.error;
        const outputToggle = hasOutput
          ? `<button class="btn-output-toggle" id="output-btn-${escHtml(item.slug)}"
               onclick="toggleOutput('${escHtml(escJs(item.slug))}')">
               ${outputOpen[item.slug] ? 'hide output' : 'show output'}
             </button>`
          : '';

        // Voice panel — only for pending text articles
        const voicePanel = isEditable && isTextArticle ? `
          <div class="card-voice-panel"
               id="voice-panel-${escHtml(item.slug)}"
               style="display:none;">
            <span class="settings-label" style="white-space:nowrap;">
              <i class="fa-solid fa-microphone" style="margin-right:4px;"></i>Voice
            </span>
            <select id="voice-select-${escHtml(item.slug)}"
                    onchange="setCardVoice('${escHtml(escJs(item.slug))}', this.value)">
              <option value="">Loading...</option>
            </select>
          </div>` : '';

        // Metadata edit fields — hidden by default, shown via the same
        // gear toggle as the voice panel above (toggleCardVoice). Lets
        // the user fix scraper title/author/site mis-mapping by hand,
        // for any pending item.
        const editFields = isEditable ? `
          <div class="card-edit-fields" id="edit-fields-${escHtml(item.slug)}" style="display:none;">
            <div class="edit-title-author-group">
              <input type="text" class="edit-input" id="edit-title-${escHtml(item.slug)}"
                     placeholder="Title" value="${escHtml(item.title || '')}">
              <input type="text" class="edit-input" id="edit-author-${escHtml(item.slug)}"
                     placeholder="Author" value="${escHtml(item.artist || '')}">
              <button class="btn-swap" type="button"
                      onclick="swapTitleAuthor('${escHtml(escJs(item.slug))}')"
                      title="Swap title and author">
                <i class="fa-solid fa-arrows-up-down"></i>
              </button>
            </div>
            <input type="text" class="edit-input" id="edit-site-${escHtml(item.slug)}"
                   placeholder="Site" value="${escHtml(item.album || '')}">
          </div>` : '';

        card.innerHTML = `
          <div class="card-main">
            ${artHtml}
            <div class="card-info">
              <div class="card-title" id="title-display-${escHtml(item.slug)}">${escHtml(item.title || item.slug)}</div>
              <div class="card-meta" id="meta-display-${escHtml(item.slug)}">
                ${escHtml(item.album || '')}${item.album && item.artist ? ' &middot; ' : ''}${escHtml(item.artist || '')}
              </div>
              ${editFields}
              ${outputToggle ? `<div style="margin-top:4px">${outputToggle}</div>` : ''}
            </div>
            <div class="card-actions">${actionHtml}</div>
          </div>
          ${item.error ? `<div class="card-error">${escHtml(item.error)}</div>` : ''}
          ${item.fetch_output ? `
            <div class="card-output ${outputOpen[item.slug] ? 'open' : ''}"
                 id="output-${escHtml(item.slug)}">
              <div class="card-output-inner">${escHtml(item.fetch_output)}</div>
            </div>` : ''}
          ${voicePanel}
        `;

        list.appendChild(card);

        // Restore an open edit panel (and populate the voice dropdown,
        // when there is one) after card is in DOM
        if (item.status === 'pending' && voicePanelOpen[item.slug]) {
          const panel = document.getElementById(`voice-panel-${item.slug}`);
          if (panel) {
            panel.style.display = '';
            populateVoiceSelect(
              `voice-select-${item.slug}`,
              item.voice || ''
            );
          }

          const titleDisplay = document.getElementById(`title-display-${item.slug}`);
          const metaDisplay  = document.getElementById(`meta-display-${item.slug}`);
          const editFieldsEl = document.getElementById(`edit-fields-${item.slug}`);
          if (titleDisplay) titleDisplay.style.display = 'none';
          if (metaDisplay)  metaDisplay.style.display  = 'none';
          if (editFieldsEl) editFieldsEl.style.display = '';
        }

      } catch (e) {
        console.error('Queue card render error:', item.slug, e);
      }
    });
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function escJs(str) {
  if (!str) return '';
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
  }

  function confirmDelete(slug, title) {
    confirmingSlug = slug;
    const card = document.querySelector(`.queue-card[data-slug="${slug}"]`);
    if (!card) return;
    const actions = card.querySelector('.card-actions');
    actions.innerHTML = `
      <span style="font-size:12px;color:var(--muted);margin-right:6px;">Delete?</span>
      <button class="btn-icon success" onclick="deleteItem('${escHtml(escJs(slug))}')" title="Yes">&#10003;</button>
      <button class="btn-icon" onclick="cancelDelete()" title="No">&#10005;</button>
    `;
  }

  function cancelDelete() {
    confirmingSlug = null;
    pollQueue();  // immediate refresh to restore card
  }

  async function deleteItem(slug) {
    confirmingSlug = null;
    const res = await fetch('/api/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({slug}),
    });
    if (!res.ok) {
      const d = await res.json();
      showError(d.error || 'Could not delete file.');
    }
    pollQueue();
  }

  async function toggleLibrary() {
    libraryOpen = !libraryOpen;
    const body    = document.getElementById('libraryBody');
    const chevron = document.getElementById('libraryChevron');
    body.style.display = libraryOpen ? '' : 'none';
    chevron.innerHTML  = libraryOpen ? '&#8963;' : '&#8964;';
    if (libraryOpen) await loadLibrary();
  }

  async function loadLibrary() {
    const res  = await fetch('/api/library');
    const data = await res.json();

    const accordion = document.getElementById('libraryAccordion');
    if (data.total === 0) {
      accordion.style.display = 'none';
      return;
    }
    accordion.style.display = '';

    const list = document.getElementById('libraryList');
    list.innerHTML = '';
    for (const k in libArtPaths) delete libArtPaths[k];

    document.getElementById('libraryCount').textContent =
      `(${data.total} podcast${data.total !== 1 ? 's' : ''})`;

    data.items.forEach(item => {
      try {
        const card = document.createElement('div');
        card.className       = 'library-card';
        card.dataset.libpath = item.path;

        const safeId = Math.random().toString(36).substring(2, 10);

        // Art is swappable here too -- rewrites the art in the MP3 itself.
        const artKey = `lib-${safeId}`;
        libArtPaths[artKey] = item.path;
        const artHtml = artCellHtml(artKey, item.art_b64, true);

        card.innerHTML = `
          <div class="card-main">
            ${artHtml}
            <div class="card-info">
              <div class="card-title">${escHtml(item.title)}</div>
              <div class="card-meta">
                ${escHtml(item.site)}${item.site && item.author ? ' &middot; ' : ''}${escHtml(item.author)}
              </div>
            </div>
            <div class="card-actions" id="lib-actions-${safeId}">
              <a class="btn-icon success"
                href="/api/library/download?path=${encodeURIComponent(item.path)}"
                download="${escHtml(item.title)}.mp3"
                title="Download">&#8595;</a>
              <button class="btn-icon danger"
                onclick="confirmLibDelete('${escHtml(escJs(item.path))}', '${escHtml(escJs(item.title))}')"
                title="Delete">
                <i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
        list.appendChild(card);
      } catch(e) {
        console.error('Library card render error:', item.title, e);
      }
    });
  }

  function confirmLibDelete(path, title) {
    confirmingLibPath = path;
    
    // Find the exact card matching our raw file path
    const cards = document.querySelectorAll('.library-card');
    let targetCard = null;
    
    for (let i = 0; i < cards.length; i++) {
      if (cards[i].dataset.libpath === path) {
        targetCard = cards[i];
        break;
      }
    }

    if (!targetCard) return;
    
    const actions = targetCard.querySelector('.card-actions');
    if (!actions) return;

    actions.innerHTML = `
      <span style="font-size:12px;color:var(--muted);margin-right:6px;">Delete?</span>
      <button class="btn-icon success" onclick="deleteLibItem('${escHtml(escJs(path))}')" title="Yes">&#10003;</button>
      <button class="btn-icon" onclick="cancelLibDelete('${escHtml(escJs(path))}')" title="No">&#10005;</button>
    `;
  }

  function cancelLibDelete(path) {
    confirmingLibPath = null;
    loadLibrary();
  }

  async function deleteLibItem(path) {
    confirmingLibPath = null;
    const res = await fetch('/api/library/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path}),
    });
    if (!res.ok) {
      const d = await res.json();
      showError(d.error || 'Could not delete file.');
      return;
    }
    loadLibrary();
  }

  // iOS Safari/Firefox: tapping the Add button while the URL input is
  // focused first has to dismiss the keyboard, which reflows the viewport
  // and shifts the button — swallowing that first tap. Blur proactively on
  // touchstart so the reflow happens before the tap is evaluated.
  document.getElementById('addBtn').addEventListener('touchstart', () => {
    document.getElementById('urlInput').blur();
  });

  // Start polling
  schedulePoll(0);  // immediate first poll
  initLibrary();
  pollQueue();
</script>
</body>
</html>
